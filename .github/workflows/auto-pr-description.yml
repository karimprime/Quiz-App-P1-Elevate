name: Auto PR Description

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: pr-desc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  generate-description:
    name: Generate & Update PR Description
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate PR Description via Gemini
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          async function run() {
            const apiKey = process.env.GEMINI_API_KEY;
            const repoName = process.env.REPO_NAME || 'Quiz-App-P1-Elevate';
            const baseRef = process.env.BASE_REF || 'main';
            const headRef = process.env.HEAD_REF || '';
            const prTitle = process.env.PR_TITLE || '';
            const prNumber = process.env.PR_NUMBER || '';

            // Ensure base branch is fetched for diff comparison
            try {
              execSync(`git fetch origin ${baseRef} --depth=100`, { stdio: 'inherit' });
            } catch (e) {
              console.log('Notice: fetch error:', e.message);
            }

            // Get commits in this PR
            let commits = '';
            try {
              commits = execSync(`git log origin/${baseRef}..HEAD --oneline --no-merges -n 30`).toString().trim();
            } catch (e) {
              commits = execSync('git log -n 5 --oneline').toString().trim();
            }

            // Get changed files
            let changedFiles = '';
            try {
              changedFiles = execSync(`git diff --name-status origin/${baseRef}...HEAD`).toString().trim();
            } catch (e) {
              console.log('Notice: changed files error:', e.message);
            }

            // Get git diff patch (limited to 50KB to keep tokens optimal)
            let diffPatch = '';
            try {
              diffPatch = execSync(`git diff origin/${baseRef}...HEAD`).toString();
              if (diffPatch.length > 50000) {
                diffPatch = diffPatch.substring(0, 50000) + '\n\n...[diff truncated for length]...';
              }
            } catch (e) {
              console.log('Notice: diff error:', e.message);
            }

            const prompt = [
              `You are a GitHub Pull Request description generator for an Angular application called ${repoName}.`,
              'Analyze the following branch, PR title, commits, changed files, and git diff.',
              '',
              'Branch: ' + headRef,
              'PR Title: ' + prTitle,
              '',
              'Commits:',
              commits,
              '',
              'Changed Files:',
              changedFiles,
              '',
              'Git Diff:',
              diffPatch,
              '',
              'Generate a concise, professional Pull Request description strictly following this format:',
              '',
              '## Description',
              '<1-2 sentences summarizing what this PR accomplishes>',
              '',
              '## Related Issue',
              'Closes <Extract issue number from branch name (e.g. HRM-1234, issue-42), PR title, or commit messages like #123. If found write Closes #<number>. If none found, write Closes #>',
              '',
              '## Commit — <type>: <emoji> <title>',
              '<Use conventional commit type and emoji like feat: ✨, fix: 🐛, refactor: ♻️, docs: 📝, style: 🎨, test: 🧪, ci: ⚡, chore: 🤖, perf: ⚡>',
              '',
              '**Problem:** <Clear 1-2 sentence explanation of the root cause or why this change was needed>',
              '',
              '**Fix:** <Clear 1-2 sentence explanation of how the problem was resolved>',
              '',
              '### What Changed → Why',
              '',
              '| File | Change |',
              '| :--- | :--- |',
              '| `filename` | <Clear explanation of what changed and why> |',
              '',
              'CRITICAL RULES:',
              '1. Output ONLY the raw markdown content. Do NOT wrap the entire response in markdown code blocks (```markdown ... ```).',
              '2. Do NOT add any extra sections (no Type of Change, no Testing checkboxes, no Screenshots, no Deployment Notes).',
              '3. The table MUST have exactly 2 columns: "File" and "Change".',
              '4. The section header MUST be EXACTLY: "### What Changed → Why" (using the unicode arrow →, not ->).',
              '5. File names in the table MUST be enclosed in backticks (e.g., `filename.ts`).',
              '6. Group multiple files together if they belong to the same component (e.g. `component.ts`, `.html`, `.scss`).',
              '7. Write clear, professional English.'
            ].join('\n');

            // Prioritize reliable, fast models with high availability first
            const models = [
              'gemini-3.5-flash-lite',
              'gemini-3.6-flash',
              'gemini-flash-lite-latest',
              'gemini-flash-latest',
              'gemini-3.8-flash'
            ];
            const MAX_RETRIES = 2;
            let response;
            let lastError = null;

            if (apiKey) {
              for (const model of models) {
                console.log(`Trying model: ${model}`);
                for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
                  try {
                    console.log(`Attempt ${attempt}/${MAX_RETRIES} with model ${model}...`);
                    response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json',
                        'x-goog-api-key': apiKey
                      },
                      body: JSON.stringify({
                        contents: [{
                          parts: [{ text: prompt }]
                        }],
                        generationConfig: {
                          temperature: 0.2,
                          maxOutputTokens: 2048
                        }
                      })
                    });

                    if (response.ok) {
                      console.log(`Success on attempt ${attempt} with ${model}.`);
                      break;
                    }

                    const errText = await response.text();
                    lastError = `Model ${model} attempt ${attempt} failed (${response.status}): ${errText}`;
                    console.log(lastError);

                    // Skip immediately to next model if daily quota is exceeded (retrying won't help)
                    if (response.status === 429 && /quota/i.test(errText)) {
                      console.log(`Quota exceeded for ${model}, skipping to next model.`);
                      break;
                    }

                    // Retry once on transient errors (503 UNAVAILABLE, 429 RATE_LIMIT), then move to next model
                    if ((response.status === 503 || response.status === 429) && attempt < MAX_RETRIES) {
                      const delay = 1500;
                      console.log(`Retrying ${model} in ${delay / 1000}s...`);
                      await new Promise(r => setTimeout(r, delay));
                      continue;
                    }
                    break; // Move to next model
                  } catch (e) {
                    lastError = `Model ${model} attempt ${attempt} error: ${e.message}`;
                    console.log(lastError);
                    if (attempt < MAX_RETRIES) {
                      await new Promise(r => setTimeout(r, 1500));
                    }
                  }
                }
                if (response && response.ok) break;
              }
            } else {
              console.log('GEMINI_API_KEY secret not found. Using intelligent fallback description generator.');
            }

            let generatedText = '';
            if (response && response.ok) {
              const data = await response.json();
              generatedText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
            }

            if (!generatedText) {
              console.warn(`All Gemini models failed or key missing. Last error: ${lastError}`);
              console.log('Generating fallback PR description from git metadata...');

              const fileRows = (changedFiles || '').split('\n')
                .filter(Boolean)
                .map(line => {
                  const parts = line.trim().split(/\s+/);
                  const status = parts[0];
                  const file = parts.slice(1).join(' ') || parts[0];
                  const action = status === 'A' ? 'Added new file' : status === 'D' ? 'Removed file' : 'Updated file';
                  return `| \`${file}\` | ${action} |`;
                }).join('\n');

              const firstLine = (prTitle || (commits ? commits.split('\n')[0] : '')).trim();
              const typeMatch = firstLine.match(/^(feat|fix|refactor|docs|style|test|ci|chore|perf)(?:\([^)]+\))?:?\s*(.*)$/i);
              const type = typeMatch ? typeMatch[1].toLowerCase() : 'chore';
              const subject = typeMatch && typeMatch[2] ? typeMatch[2].replace(/^[^\w\s]+/, '').trim() : (firstLine || 'update');

              const emojiMap = {
                feat: '✨',
                fix: '🐛',
                refactor: '♻️',
                docs: '📝',
                style: '🎨',
                test: '🧪',
                ci: '⚡',
                chore: '🤖',
                perf: '⚡'
              };
              const emoji = emojiMap[type] || '🤖';

              const issueMatch = (headRef + ' ' + prTitle + ' ' + commits).match(/(?:#|issue-|hrm-)(\d+)/i);
              const issueNum = issueMatch ? `#${issueMatch[1]}` : '#';

              generatedText = [
                '## Description',
                firstLine || 'Automated PR update based on changes.',
                '',
                '## Related Issue',
                `Closes ${issueNum}`,
                '',
                `## Commit — ${type}: ${emoji} ${subject}`,
                '',
                '**Problem:** Need automated updates and traceability for the latest changes.',
                '',
                '**Fix:** Generated structured PR description summarizing branch changes and modified files.',
                '',
                '### What Changed → Why',
                '',
                '| File | Change |',
                '| :--- | :--- |',
                fileRows || '| `changes` | Various updates |'
              ].join('\n');
            }

            // Strip code block wrapping
            generatedText = generatedText
              .replace(/^```(?:markdown)?\s*\n?/i, '')
              .replace(/\n?```\s*$/i, '')
              .trim();

            // Guarantee unicode arrow formatting in section header
            generatedText = generatedText.replace(/###\s*What Changed\s*(?:->|–|—|to)\s*Why/gi, '### What Changed → Why');

            fs.writeFileSync('pr_description.md', generatedText);
            console.log('PR description successfully generated.');
          }

          run().catch(err => {
            console.error('Failed to generate PR description:', err);
            process.exit(1);
          });
          EOF

      - name: Update PR Description on GitHub
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr_description.md')) {
              console.log('No pr_description.md found, skipping update.');
              return;
            }
            const body = fs.readFileSync('pr_description.md', 'utf8');
            if (!body || body.trim() === '') {
              console.log('Empty description, skipping update.');
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: body
            });
            console.log(`Successfully updated PR #${context.payload.pull_request.number} description.`);
