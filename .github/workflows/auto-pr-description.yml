name: Auto PR Description

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: pr-desc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  generate-description:
    name: Generate & Update PR Description
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate PR Description via Gemini
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const EMOJI_MAP = {
            feat: '✨',
            fix: '🐛',
            refactor: '♻️',
            docs: '📝',
            style: '🎨',
            test: '🧪',
            ci: '⚡',
            chore: '🤖',
            perf: '⚡'
          };

          function parseCommitMessage(message) {
            const firstLine = (message || '').trim().split('\n')[0].trim();
            const match = firstLine.match(/^(feat|fix|refactor|docs|style|test|ci|chore|perf)(?:\(([^)]+)\))?:\s*(.*)$/i);
            if (match) {
              const type = match[1].toLowerCase();
              const scope = match[2] ? match[2].trim() : '';
              const rawSubject = match[3] ? match[3].trim() : '';
              const emoji = EMOJI_MAP[type] || '🤖';
              const cleanSubject = rawSubject.replace(/^[^\w\s]+/, '').trim();
              const formattedTitle = scope
                ? `${type}(${scope}): ${emoji} ${cleanSubject}`
                : `${type}: ${emoji} ${cleanSubject}`;
              return { type, scope, subject: cleanSubject, formattedTitle };
            }
            return {
              type: 'chore',
              scope: '',
              subject: firstLine || 'update',
              formattedTitle: `chore: 🤖 ${firstLine || 'update'}`
            };
          }

          async function callGemini(apiKey, prompt) {
            if (!apiKey) return null;
            const models = [
              'gemini-2.5-flash',
              'gemini-2.0-flash',
              'gemini-1.5-flash',
              'gemini-3.5-flash-lite',
              'gemini-3.6-flash',
              'gemini-flash-latest'
            ];
            const MAX_RETRIES = 2;

            for (const model of models) {
              for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
                try {
                  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'x-goog-api-key': apiKey
                    },
                    body: JSON.stringify({
                      contents: [{ parts: [{ text: prompt }] }],
                      generationConfig: {
                        temperature: 0.2,
                        maxOutputTokens: 2048
                      }
                    })
                  });

                  if (res.ok) {
                    const data = await res.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) return text.trim();
                  }

                  const errText = await res.text();
                  if (res.status === 429 && /quota/i.test(errText)) {
                    break;
                  }
                  if ((res.status === 503 || res.status === 429) && attempt < MAX_RETRIES) {
                    await new Promise(r => setTimeout(r, 1500));
                    continue;
                  }
                  break;
                } catch (e) {
                  if (attempt < MAX_RETRIES) await new Promise(r => setTimeout(r, 1500));
                }
              }
            }
            return null;
          }

          function generateFallbackCommitSection(commit, changedFiles) {
            const parsed = parseCommitMessage(commit.subject);
            const fileLines = (changedFiles || '').split('\n').filter(Boolean);
            const fileRows = fileLines.map(line => {
              const parts = line.trim().split(/\s+/);
              const status = parts[0] || 'M';
              const file = parts.slice(1).join(' ') || parts[0];
              let action = '**Updated** implementation to support required changes';
              if (status === 'A') action = '**Added** new file and configuration';
              else if (status === 'D') action = '**Removed** obsolete file to clean up codebase';
              else if (status && status.startsWith('R')) action = '**Renamed** file for better structure';
              return `| \`${file}\` | ${action} |`;
            }).join('\n');

            return [
              `## Commit — ${parsed.formattedTitle}`,
              `<!-- commit-hash: ${commit.shortHash} -->`,
              '',
              '**Problem:**',
              `Identified need for updates in ${parsed.scope || parsed.type} affecting ${fileLines.length} file(s).`,
              '',
              '**Fix:**',
              `Implemented required changes and modular improvements for ${parsed.scope || 'the feature'}.`,
              '',
              '### What Changed → Why',
              '',
              '| File | Change |',
              '| :--- | :--- |',
              fileRows || '| `changes` | **Updated** various project files |'
            ].join('\n');
          }

          async function generateCommitSection(apiKey, repoName, commit, changedFiles, diffPatch) {
            const parsed = parseCommitMessage(commit.subject);
            const prompt = [
              `You are a Senior Technical Reviewer generating a Pull Request description for an Angular application (${repoName}).`,
              `Analyze the following single commit and generate a dedicated, beautifully formatted commit section for reviewers.`,
              '',
              `Commit Subject: ${commit.subject}`,
              `Commit Hash: ${commit.shortHash}`,
              `Changed Files:`,
              changedFiles,
              '',
              `Git Diff (truncated):`,
              diffPatch,
              '',
              'Strictly output ONLY the markdown for this single commit in the exact following structure:',
              '',
              `## Commit — ${parsed.formattedTitle}`,
              `<!-- commit-hash: ${commit.shortHash} -->`,
              '',
              '**Problem:**',
              '<Clear, professional 1-2 sentence explanation of the specific problem, bug, limitation, or motivation addressed by this commit>',
              '',
              '**Fix:**',
              '<Clear, professional 1-2 sentence explanation of what was modified, how the solution works, and how it resolves the issue>',
              '',
              '### What Changed → Why',
              '',
              '| File | Change |',
              '| :--- | :--- |',
              '| `filepath` | **<Action Verb>** <Brief, clear explanation of what changed in this file and why> |',
              '',
              'CRITICAL RULES:',
              '1. Document ONLY this commit.',
              '2. Start each Change description with a bold action verb (e.g., **Migrated**, **Added**, **Updated**, **Cleaned up**, **Resolved**, **Refactored**).',
              '3. The table header MUST have exactly 2 columns: "File" and "Change".',
              '4. The section header MUST be EXACTLY "### What Changed → Why" (unicode arrow →).',
              '5. Every file name in the table MUST be enclosed in backticks (`filename`).',
              '6. Do NOT wrap output in markdown code blocks. Output raw markdown only.',
              '7. Write clear, natural, professional English.'
            ].join('\n');

            const generated = await callGemini(apiKey, prompt);
            if (generated) {
              let cleaned = generated
                .replace(/^```(?:markdown)?\s*\n?/i, '')
                .replace(/\n?```\s*$/i, '')
                .trim();
              cleaned = cleaned.replace(/###\s*What Changed\s*(?:->|–|—|to)\s*Why/gi, '### What Changed → Why');
              if (!cleaned.includes(`<!-- commit-hash: ${commit.shortHash} -->`)) {
                cleaned = cleaned.replace(/(^## Commit — [^\n]+)/m, `$1\n<!-- commit-hash: ${commit.shortHash} -->`);
              }
              return cleaned;
            }

            return generateFallbackCommitSection(commit, changedFiles);
          }

          async function generateExecutiveDescription(apiKey, repoName, prTitle, headRef, allCommits, allDiff) {
            const prompt = [
              `You are a Senior Technical Reviewer generating a Pull Request description for an Angular application (${repoName}).`,
              `Generate a high-level executive summary for the pull request.`,
              `PR Title: ${prTitle}`,
              `Branch: ${headRef}`,
              `Commits:\n${allCommits}`,
              `Git Diff summary:\n${allDiff.substring(0, 15000)}`,
              '',
              'Output 1-2 concise, professional paragraphs summarizing what this pull request delivers across all modules, layouts, and components.',
              'Do NOT include any markdown headers or bullet points. Output plain text paragraphs only.'
            ].join('\n');

            const text = await callGemini(apiKey, prompt);
            if (text) {
              return text.replace(/^```(?:markdown)?\s*\n?/i, '').replace(/\n?```\s*$/i, '').trim();
            }

            return `This pull request delivers updates for ${prTitle || headRef}, implementing required functionality and enhancements across affected Angular modules and shared components.`;
          }

          async function run() {
            const apiKey = process.env.GEMINI_API_KEY;
            const repoName = process.env.REPO_NAME || 'HRM_front';
            const baseRef = process.env.BASE_REF || 'main';
            const headRef = process.env.HEAD_REF || '';
            const prTitle = process.env.PR_TITLE || '';
            const prNumber = process.env.PR_NUMBER || '';
            const existingBody = (process.env.PR_BODY || '').trim();

            // Ensure base branch is fetched for diff comparison
            try {
              execSync(`git fetch origin ${baseRef} --depth=100`, { stdio: 'inherit' });
            } catch (e) {
              console.log('Notice: fetch error:', e.message);
            }

            // Get all commits in this PR in chronological order (oldest to newest)
            let commitsList = [];
            try {
              const logOut = execSync(`git log origin/${baseRef}..HEAD --reverse --format="%H|||%h|||%s" --no-merges`).toString().trim();
              if (logOut) {
                commitsList = logOut.split('\n').filter(Boolean).map(line => {
                  const [hash, shortHash, ...subjectParts] = line.split('|||');
                  return { hash, shortHash, subject: subjectParts.join('|||').trim() };
                });
              }
            } catch (e) {
              console.log('Notice: git log error, falling back to recent commits:', e.message);
              const logOut = execSync(`git log -n 5 --reverse --format="%H|||%h|||%s" --no-merges`).toString().trim();
              if (logOut) {
                commitsList = logOut.split('\n').filter(Boolean).map(line => {
                  const [hash, shortHash, ...subjectParts] = line.split('|||');
                  return { hash, shortHash, subject: subjectParts.join('|||').trim() };
                });
              }
            }

            console.log(`Found ${commitsList.length} commit(s) in this PR.`);

            // Parse existing PR body to identify already-documented commits
            const commitHeaderSplitter = /(?=^## Commit\s*[—–-]\s*)/m;
            const existingSections = existingBody ? existingBody.split(commitHeaderSplitter) : [];
            const existingHeader = existingSections[0] && !/^## Commit\s*[—–-]/m.test(existingSections[0])
              ? existingSections[0].trim()
              : '';
            const existingCommitBlocks = existingSections.filter(s => /^## Commit\s*[—–-]/m.test(s)).map(s => s.trim());

            console.log(`Found ${existingCommitBlocks.length} existing commit section(s) in current PR description.`);

            // Determine Related Issue
            const issueMatch = (headRef + ' ' + prTitle + ' ' + (commitsList.map(c => c.subject).join(' '))).match(/(?:#|issue-|hrm-)(\d+)/i);
            const issueNum = issueMatch ? `#${issueMatch[1]}` : '';

            // Process each commit: preserve existing or generate new
            const finalCommitSections = [];

            for (const commit of commitsList) {
              // Check if this commit is already documented in existing sections
              const existingBlock = existingCommitBlocks.find(block => {
                if (block.includes(`commit-hash: ${commit.shortHash}`)) return true;
                const firstLine = block.split('\n')[0].toLowerCase();
                const parsed = parseCommitMessage(commit.subject);
                if (parsed.subject && firstLine.includes(parsed.subject.toLowerCase().substring(0, 30))) return true;
                return false;
              });

              if (existingBlock) {
                console.log(`Preserving existing section for commit ${commit.shortHash}: ${commit.subject}`);
                finalCommitSections.push(existingBlock);
              } else {
                console.log(`Generating NEW section for commit ${commit.shortHash}: ${commit.subject}`);
                let commitFiles = '';
                try {
                  commitFiles = execSync(`git show --name-status --format="" ${commit.hash}`).toString().trim();
                } catch (e) {
                  console.log(`Notice: git show files error for ${commit.shortHash}:`, e.message);
                }

                let commitDiff = '';
                try {
                  commitDiff = execSync(`git show ${commit.hash}`).toString();
                  if (commitDiff.length > 20000) {
                    commitDiff = commitDiff.substring(0, 20000) + '\n\n...[diff truncated for length]...';
                  }
                } catch (e) {
                  console.log(`Notice: git show diff error for ${commit.shortHash}:`, e.message);
                }

                const newSection = await generateCommitSection(apiKey, repoName, commit, commitFiles, commitDiff);
                finalCommitSections.push(newSection);
              }
            }

            // Build Top Header (## Description & ## Related Issue)
            let headerPart = existingHeader;
            if (!headerPart || !headerPart.includes('## Description')) {
              let allDiff = '';
              try {
                allDiff = execSync(`git diff origin/${baseRef}...HEAD`).toString();
              } catch (e) {}

              const execDesc = await generateExecutiveDescription(
                apiKey,
                repoName,
                prTitle,
                headRef,
                commitsList.map(c => c.subject).join('\n'),
                allDiff
              );

              const relatedIssueLine = issueNum ? `Closes ${issueNum}` : 'None';

              headerPart = [
                '## Description',
                '',
                execDesc,
                '',
                '## Related Issue',
                '',
                relatedIssueLine,
                '',
                '> 💡 **Reviewer Context:**',
                `> 📦 **Branch:** \`${headRef}\` → \`${baseRef}\` &nbsp;|&nbsp; 🔢 **Commits:** \`${commitsList.length}\``
              ].join('\n');
            } else if (!headerPart.includes('## Related Issue')) {
              const relatedIssueLine = issueNum ? `Closes ${issueNum}` : 'None';
              headerPart += `\n\n## Related Issue\n\n${relatedIssueLine}`;
            }

            // Separate commits with horizontal rules (---) for a clean visual card hierarchy
            const formattedCommitCards = finalCommitSections
              .map(sec => sec.trim())
              .filter(Boolean)
              .join('\n\n---\n\n');

            // Add Reviewer Checklist Accordion at the bottom
            const reviewerChecklist = [
              '---',
              '',
              '<details>',
              '<summary>🔍 <b>Reviewer Guidance & Checklist</b></summary>',
              '',
              '- [ ] **Architecture:** Changes follow clean architectural standards and feature-based structure.',
              '- [ ] **Readability & Formatting:** No hardcoded values, dead code, or magic strings.',
              '- [ ] **Regression Check:** Existing workflows and edge cases remain fully functional.',
              '</details>'
            ].join('\n');

            // Assemble the full PR description
            const fullDescription = [
              headerPart.trim(),
              '',
              '---',
              '',
              formattedCommitCards,
              '',
              reviewerChecklist
            ].join('\n').trim();

            fs.writeFileSync('pr_description.md', fullDescription);
            console.log('PR description successfully compiled with all commits and enhanced UI/UX.');
          }

          run().catch(err => {
            console.error('Failed to generate PR description:', err);
            process.exit(1);
          });
          EOF

      - name: Update PR Description on GitHub
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr_description.md')) {
              console.log('No pr_description.md found, skipping update.');
              return;
            }
            const body = fs.readFileSync('pr_description.md', 'utf8');
            if (!body || body.trim() === '') {
              console.log('Empty description, skipping update.');
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: body
            });
            console.log(`Successfully updated PR #${context.payload.pull_request.number} description.`);
